<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satik MC Structure Finder</title>
    
    <!-- Monetag Website Verification Tag -->
    <meta name="monetag" content="76c5e464d18c851a22956e31441477cf">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #2d2d2d;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 450px;
            border: 2px solid #555555;
            text-align: center;
        }

        h2 {
            color: #4CAF50;
            margin-bottom: 5px;
            font-size: 24px;
            text-shadow: 1px 1px 2px #000000;
        }

        p.subtitle {
            color: #aaaaaa;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 6px;
            display: block;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #444444;
            background-color: #111111;
            color: #ffffff;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            background-color: #388E3C;
            transform: scale(0.98);
        }

        .info-box {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
            border-top: 1px solid #444444;
            padding-top: 15px;
        }

        .cmd-hint {
            color: #FFA500;
            font-weight: bold;
            margin-top: 10px;
            display: block;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Satik MC Finder</h2>
        <p class="subtitle">v1.26.62 Real Coordinates Tracker</p>

        <label for="seedInput">Enter Seed Number:</label>
        <input type="number" id="seedInput" placeholder="e.g. 123456789" required>

        <label for="gameVersion">Select Game Edition:</label>
        <select id="gameVersion">
            <option value="bedrock_1_21">Bedrock Edition (Mobile/PE) v1.26.62+</option>
            <option value="java_1_21">Java Edition (PC) v1.26.62+</option>
        </select>

        <button onclick="launchWithAd()">Open Satik Map</button>

        <div class="info-box">
            <p>Note: Chunckbase map khulne se pehle sponsor tab open hoga.</p>
            <span class="cmd-hint">In-Game Direct Command: <br> /locate structure minecraft:trail_chamber</span>
        </div>
    </div>

    <script>
        function launchWithAd() {
            const seed = document.getElementById('seedInput').value.trim();
            const version = document.getElementById('gameVersion').value;

            // Yahan apna asli Monetag Direct Link paste karo:
            const monetagDirectLink = "https://uplcm.com/4/12235967";

            if (!seed) {
                alert("Pehle Seed number enter karo!");
                return;
            }

            // Step 1: Earning ke liye naye background tab mein Monetag Direct Link open hoga
            window.open(monetagDirectLink, '_blank');

            // Step 2: Current window mein seed ke exact location par Chunkbase ka official map load hoga
            const targetMapUrl = `https://www.chunkbase.com/apps/seed-map#seed=${seed}&platform=${version}&x=0&z=0&zoom=0.5`;
            window.location.href = targetMapUrl;
        }
    </script>

</body>
</html>
